<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kampus Q-Ready Registration Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <img
      src="media/images/Logo5.png"
      alt="Logo"
      class="logo registration-logo"
    />
    <form class="registration-form">
      <!--Login Form-->
      <div class="login-container">
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input
            type="text"
            class="form-control registration-input"
            id="name"
            name="name"
            placeholder="Enter name"
            required
          />
        </div>

        <div class="mb-2">
          <label for="surname" class="form-label">Surname</label>
          <input
            type="text"
            class="form-control login-input"
            id="surname"
            name="surname"
            placeholder="Enter surname"
            required
          />
        </div>
        <div class="mb-2">
          <label for="studentNumber" class="form-label"> Student Number </label>
          <input
            type="text"
            class="form-control login-input"
            id="studentNumber"
            name="studentNumber"
            placeholder="Enter student number"
            required
          />
        </div>

        <div class="mb-2">
          <label for="password" class="form-label"> Password </label>
          <input
            type="password"
            class="form-control login-input"
            id="password"
            name="password"
            placeholder="Enter password"
            required
          />
        </div>
        <div class="mb-3">
          <label for="confirmPassword" class="form-label">
            Confirm Password
          </label>

          <input
            type="password"
            class="form-control login-input"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Confirm password"
            required
          />
        </div>
      </div>

      <!-- Register Button -->
      <div class="d-flex justify-content-center">
        <button type="submit" class="btn register-btn">Register</button>
      </div>
      <!--Login/Register/Guest Radio Buttons-->

      <div class="d-flex justify-content-center gap-4">
        <div class="form-check">
          <input
            class="form-check-input"
            type="radio"
            name="radioDefault"
            id="radioLogin"
            checked
          />
          <label class="form-check-label" for="radioLogin"> Login </label>
        </div>

        <div class="form-check">
          <input
            class="form-check-input"
            type="radio"
            name="radioDefault"
            id="radioRegister"
          />
          <label class="form-check-label" for="radioRegister"> Register </label>
        </div>

        <div class="form-check">
          <input
            class="form-check-input"
            type="radio"
            name="radioDefault"
            id="radioGuest"
          />
          <label class="form-check-label" for="radioGuest"> Guest </label>
        </div>
      </div>
    </form>
  </body>
</html>
