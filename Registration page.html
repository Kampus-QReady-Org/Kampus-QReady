<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- NWU Logo -->
    <img
      src="media/images/Logo5 (1).png"
      alt="Logo"
      class="logo registration-logo"
    />
    <div class="system-branding branding-registration">
      <h1>Kampus <span>Q-Ready</span></h1>
      <div class="brand-line"></div>
      <p>Your Health. Our Priority.</p>
    </div>

    <form id="registrationForm" class="registration-form">
      <!-- Name + Surname -->
      <div class="row g-2">
        <div class="col-md-6">
          <label for="name" class="form-label">Name</label>
          <input
            type="text"
            class="form-control"
            id="name"
            placeholder="Enter name"
            required
            oninvalid="this.setCustomValidity('Please enter your name.')"
            oninput="this.setCustomValidity('')"
          />
        </div>

        <div class="col-md-6">
          <label for="surname" class="form-label">Surname</label>
          <input
            type="text"
            class="form-control"
            id="surname"
            placeholder="Enter surname"
            required
            oninvalid="this.setCustomValidity('Please enter your surname.')"
            oninput="this.setCustomValidity('')"
          />
        </div>
      </div>

      <!-- Phone + Email -->
      <div class="row g-2 mt-1">
        <div class="col-md-6">
          <label for="phoneNumber" class="form-label">Phone Number</label>
          <input
            type="tel"
            class="form-control"
            id="phoneNumber"
            placeholder="Enter phone number"
            pattern="[0-9]{10}"
            maxlength="10"
            required
            oninvalid="
              this.setCustomValidity('Please enter your phone number.')
            "
            oninput="this.setCustomValidity('')"
          />
        </div>

        <div class="col-md-6">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="Enter email address"
            required
            oninvalid="
              this.setCustomValidity('Please enter a valid email address.')
            "
            oninput="this.setCustomValidity('')"
          />
        </div>
      </div>

      <!-- Register As -->
      <div class="mt-2">
        <label class="form-label">Register as</label>

        <div class="d-flex gap-4">
          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="userType"
              id="studentType"
              value="student"
              required
              oninvalid="
                this.setCustomValidity(
                  'Please select whether you are a Student or NWU Staff member.',
                )
              "
              onchange="this.setCustomValidity('')"
            />
            <label class="form-check-label" for="studentType"> Student </label>
          </div>

          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="userType"
              id="staffType"
              value="staff"
              onchange="
                document.getElementById('studentType').setCustomValidity('')
              "
            />
            <label class="form-check-label" for="staffType"> NWU Staff </label>
          </div>
        </div>
      </div>

      <!-- Student/Staff Number -->
      <div class="mt-2">
        <label for="userNumber" class="form-label" id="userNumberLabel">
          Student/Staff Number
        </label>

        <input
          type="text"
          class="form-control"
          id="userNumber"
          placeholder="Enter student or staff number"
          required
        />
      </div>

      <!-- Password + Confirm Password -->
      <div class="row g-2 mt-1">
        <div class="col-md-6">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="Enter password"
            minlength="8"
            oninvalid="
              this.setCustomValidity(
                'Password must be at least 8 characters long.',
              )
            "
            oninput="this.setCustomValidity('')"
            required
          />
        </div>

        <div class="col-md-6">
          <label for="confirmPassword" class="form-label">
            Confirm Password
          </label>

          <input
            type="password"
            class="form-control"
            id="confirmPassword"
            placeholder="Confirm password"
            required
          />
        </div>
      </div>

      <!-- Register Button -->
      <div class="d-flex justify-content-center mt-3">
        <button type="submit" class="btn register-btn">Register</button>
      </div>

      <!-- Registration Link -->
      <p class="account-option">
        Already have an account?
        <a href="index.html">Login here</a>
      </p>

      <div class="or-divider">
        <hr />
        <span>OR</span>
        <hr />
      </div>

      <!-- Guest Login Link -->
      <p class="account-option">
        <a href="Guest login page.html">Continue as Guest</a>
      </p>
    </form>

    <script src="config.js"></script>
    <script src="response.js"></script>
  </body>
</html>
