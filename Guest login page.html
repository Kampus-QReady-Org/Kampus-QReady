<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guest Login Page - Kampus Q-Ready</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <img src="media/images/Logo5.png" alt="Logo" class="logo login-logo" />
    <form class="login-form">
      <!--Login Form-->
      <div class="login-container">
        <!-- Name -->
        <div class="mb-3">
          <label for="guestName" class="form-label">Name</label>
          <input
            type="text"
            class="form-control login-input"
            id="guestName"
            name="guestName"
            placeholder="Enter name"
            required
          />
        </div>

        <!-- Surname -->
        <div class="mb-3">
          <label for="guestSurname" class="form-label">Surname</label>
          <input
            type="text"
            class="form-control login-input"
            id="guestSurname"
            name="guestSurname"
            placeholder="Enter surname"
            required
          />
        </div>

        <!-- ID Number -->
        <div class="mb-3">
          <label for="guestId" class="form-label">ID Number</label>
          <input
            type="text"
            class="form-control login-input"
            id="guestId"
            name="guestId"
            placeholder="Enter ID number"
            required
          />
        </div>
      </div>

      <!-- Guest Login Button -->
      <div class="d-flex justify-content-center">
        <button type="submit" class="btn guest-login-btn">
          Continue as Guest
        </button>
      </div>
      <!--Login/Register/Guest Radio Buttons-->

      <div class="d-flex justify-content-center gap-4">
        <div class="form-check">
          <input
            class="form-check-input"
            type="radio"
            name="radioDefault"
            id="radioLogin"
            checked
          />
          <label class="form-check-label" for="radioLogin"> Login </label>
        </div>

        <div class="form-check">
          <input
            class="form-check-input"
            type="radio"
            name="radioDefault"
            id="radioRegister"
          />
          <label class="form-check-label" for="radioRegister"> Register </label>
        </div>

        <div class="form-check">
          <input
            class="form-check-input"
            type="radio"
            name="radioDefault"
            id="radioGuest"
          />
          <label class="form-check-label" for="radioGuest"> Guest </label>
        </div>
      </div>
    </form>
  </body>
</html>
