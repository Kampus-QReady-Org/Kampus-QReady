<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page - Kampus Q-Ready</title>
    <!-- Bootstrap CSS stylesheet for responsive styling and components -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Custom application theme styles -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- NWU branding and system logo display -->
    <img src="media/images/Logo5 (1).png" alt="Logo" class="logo login-logo" />
    <div class="system-branding">
      <h1>Kampus <span>Q-Ready</span></h1>
      <div class="brand-line"></div>
      <p>Your Health. Our Priority.</p>
    </div>

    <!-- Main user login authentication form container -->
    <form class="login-form">
      <div class="login-container">
        <!-- Input field for capturing user username, student number, or staff identifier -->
        <div class="mb-3">
          <label for="studentNumber" class="form-label">
            Username / ID Number
          </label>
          <input
            type="text"
            class="form-control login-input"
            id="studentNumber"
            name="studentNumber"
            placeholder="Enter student or staff number"
            required
            oninvalid="this.setCustomValidity('Please enter your student or staff number.')"
            oninput="this.setCustomValidity('')"
          />
        </div>

        <!-- Input field for securing account password entries -->
        <div class="mb-3">
          <label for="password" class="form-label"> Password </label>
          <input
            type="password"
            class="form-control login-input"
            id="password"
            name="password"
            placeholder="Enter password"
            required
            oninvalid="this.setCustomValidity('Please enter the correct password.')"
            oninput="this.setCustomValidity('')"
          />
          <div class="forgot-password">
            <a href="#" id="forgotPasswordLink">Forgot Password?</a>
          </div>
        </div>
      </div>

      <!-- Form submission trigger button -->
      <div class="d-flex justify-content-center">
        <button type="submit" class="btn login-btn">Login</button>
      </div>

      <!-- Navigation link redirecting unregistered users to the registration portal -->
      <p class="account-option">
        Don't have an account?
        <a href="Registration page.html">Register here</a>
      </p>

      <div class="or-divider">
        <hr />
        <span>OR</span>
        <hr />
      </div>

      <!-- Navigation option allowing users to proceed as anonymous system guests -->
      <p class="account-option">
        <a href="Guest login page.html">Continue as Guest</a>
      </p>
    </form>

    <!-- Global API base configuration script -->
    <script src="config.js"></script>
    
    <!-- Inline authentication script handling credentials payload submission and role routing -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const loginForm = document.querySelector('.login-form');

        if (loginForm) {
          loginForm.addEventListener('submit', async (e) => {
            // Prevent default HTML form submission behavior to handle via asynchronous fetch API
            e.preventDefault();

            // Retrieve and sanitize input values from the login controls
            const emailOrUsername = document.getElementById('studentNumber').value.trim();
            const password = document.getElementById('password').value.trim();

            // Resolve the backend endpoint URL using global configurations with a local fallback
            const BASE_URL = window.API_BASE_URL || (typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : 'http://localhost:3000');

            try {
              // Send authentication credentials payload to the backend login service route
              const res = await fetch(`${BASE_URL}/api/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  username: emailOrUsername,
                  email: emailOrUsername,
                  password: password
                })
              });

              const responseData = await res.json();
              console.log("Server response received:", responseData);

              // Safely extract authentication token and user metadata from alternative response structures
              const token = responseData.token || (responseData.data && responseData.data.token);
              const user = responseData.user || (responseData.data && responseData.data.user);

              if (res.ok && token) {
                // Persist the issued JWT token and user profile details securely in local storage
                localStorage.setItem('token', token);
                localStorage.setItem('user', JSON.stringify(user));

                console.log("Login successful! Navigating to dashboard...");

                // Route users dynamically to their respective dashboard views based on permission attributes
                if (user && (user.role === 'staff' || user.isStaff || user.staffNumber)) {
                  console.log("Redirecting to staff-dashboard.html");
                  window.location.replace('staff-dashboard.html');
                } else {
                  console.log("Redirecting to JoinQueue.html");
                  window.location.replace('JoinQueue.html');
                }
              } else {
                // Display error feedback message if validation or authentication fails
                alert(responseData.message || responseData.error || 'Login failed. Please check your credentials.');
              }
            } catch (err) {
              // Handle server connectivity or network failure exceptions gracefully
              console.error('Login error:', err);
              alert('Could not connect to backend server. Make sure Node.js is running on http://localhost:3000');
            }
          });
        }
      });
    </script>
    <!-- Note: response.js is intentionally omitted here to prevent duplicate submit event listeners from clashing with the redirect -->
  </body>
</html>
