<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page - Kampus Q-Ready</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- NWU Logo -->
    <img src="media/images/Logo5.png" alt="Logo" class="logo login-logo" />
    <form class="login-form">
      <!--Login Form-->
      <div class="login-container">
        <div class="mb-3">
          <label for="studentNumber" class="form-label">
            Student/Stuff Number
          </label>
          <input
            type="text"
            class="form-control login-input"
            id="studentNumber"
            name="studentNumber"
            placeholder="Enter student or staff number"
            required
            oninvalid="
              this.setCustomValidity(
                'Please enter your student or staff number.',
              )
            "
            oninput="this.setCustomValidity('')"
          />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label"> Password </label>
          <input
            type="password"
            class="form-control login-input"
            id="password"
            name="password"
            placeholder="Enter password"
            required
            oninvalid="
              this.setCustomValidity('Please enter the correct password.')
            "
            oninput="this.setCustomValidity('')"
          />
          <!-- Forgot Password Link -->
          <div class="forgot-password">
            <a href="Forgot password.html">Forgot Password?</a>
          </div>
        </div>
      </div>

      <!-- Login Button -->
      <div class="d-flex justify-content-center">
        <button type="submit" class="btn login-btn">Login</button>
      </div>
      <!--Login/Register/Guest Radio Buttons-->

      <div class="d-flex justify-content-center gap-4">
        <div class="form-check">
          <input
            class="form-check-input"
            type="radio"
            name="radioDefault"
            id="radioLogin"
            checked
          />
          <label class="form-check-label" for="radioLogin"> Login </label>
        </div>

        <div class="form-check">
          <input
            class="form-check-input"
            type="radio"
            name="radioDefault"
            id="radioRegister"
          />
          <label class="form-check-label" for="radioRegister"> Register </label>
        </div>

        <div class="form-check">
          <input
            class="form-check-input"
            type="radio"
            name="radioDefault"
            id="radioGuest"
          />
          <label class="form-check-label" for="radioGuest"> Guest </label>
        </div>
      </div>
    </form>
    <script src="response.js"></script>
  </body>
</html>
